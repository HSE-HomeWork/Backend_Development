[project]
name = "Backend_Avito"
version = "1.0.0"
description = "Зависимости под сервис"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "wemake-python-styleguide>=1.8.0",
]

[tool.ruff]
line-length = 65

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "CPY001",
    "ANN401",
    "FBT001",
]
external = ["WPS"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "INP001",
]

[tool.pytest]
testpaths = ["tests","hw2"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
]

[tool.mypy]
strict = true
mypy_path = "."

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
]
